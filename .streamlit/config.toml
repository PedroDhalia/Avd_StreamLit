# Identidade visual do app.
# Paleta derivada da EDA (Aula 11): roxo = classe de interesse (Falha), rosa = referência (Normal).
# Os tons foram ajustados para contraste >= 3:1 no fundo branco e separação para daltonismo.
# Tema claro fixo: as cores dos gráficos foram validadas contra o fundo branco.

[theme]
base = "light"
primaryColor = "#5e3e93"              # roxo da EDA: botões, sliders, abas ativas (texto branco com contraste 8:1)
backgroundColor = "#ffffff"           # fundo da página
secondaryBackgroundColor = "#f6f3f9"  # fundo dos widgets (lavanda bem clara)
textColor = "#1f1a2b"                 # texto principal, quase preto com um toque de roxo
borderColor = "#e4ddec"
linkColor = "#5e3e93"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.5rem"
metricValueFontWeight = 600

# Normal (rosa) e Falha (roxo) primeiro, na mesma ordem usada em todos os gráficos
chartCategoricalColors = ["#d4789a", "#5e3e93", "#2a78d6", "#857f93"]

[theme.sidebar]
backgroundColor = "#f6f3f9"
secondaryBackgroundColor = "#ffffff"

# Sem telemetria de uso do Streamlit
[browser]
gatherUsageStats = false
